name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # The name branch protection requires; keep it in sync with the ruleset.
    name: Typecheck and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      # The Rust crate embeds the built UI, so build it before compiling the tests.
      - run: npx vite build --config vite.tauri.config.ts
      - run: cargo test
        working-directory: src-tauri
