[package]
name = "vibeloft"
version = "1.0.0"
license = "Apache-2.0"
description = "A desktop workspace for Claude Code projects"
repository = "https://github.com/Leadows-AI/vibeloft"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = "0.4"
regex = "1"
notify = "8"
trash = "5"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
